---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Preparation and application are trusted jobs. The agent consumes
# an offline issue packet on a third runner with no App credential.
# Never move an App-token action into the agent job: its post action
# receives the private-key input again, after untrusted code ran.
name: 'Issues Triage [R] 🏷️'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      org:
        description: 'Target owner; live runs require an organisation App'
        required: true
        type: string
      model:
        description: 'Copilot CLI model identifier'
        type: string
        default: 'claude-opus-5.5'
      dry_run:
        description: 'Validate proposals without applying changes'
        type: boolean
        default: true
      retriage:
        description: 'Re-examine issues that carry labels'
        type: boolean
        default: false
      skip_agent:
        description: 'Plumbing test: skip the agent session entirely'
        type: boolean
        default: false
      repository:
        description: 'Restrict the scan to one repository'
        type: string
        default: ''
      exclude_repos:
        description: 'Comma-separated repos to skip (overrides bundled list)'
        type: string
        default: ''

      egress_policy:
        description: 'harden-runner egress mode: audit or block'
        type: string
        default: 'audit'
      egress_allow_config:
        description: 'harden-runner-block-action config coordinate'
        type: string
        default: ''
      github_app_client_id:
        description: 'GitHub App client id; empty limits runs to dry-run'
        type: string
        default: ''
      assets_repository:
        description: 'Trusted repository providing the prompt and scripts'
        type: string
        default: 'lfreleng-actions/github-issues-triage'
      assets_ref:
        description: >-
          Trusted assets ref; resolved once to a commit. Empty locks
          assets to the called workflow commit when available.
        type: string
        default: ''
    secrets:
      copilot_token:
        description: >-
          Personal fine-grained PAT with Copilot Requests and no
          repository permissions. Caller GITHUB_TOKEN is not supported.
        required: false
      github_app_private_key:
        description: 'GitHub App private key, used in trusted jobs alone'
        required: false

permissions: {}

# Live runs hold one lock across preparation, proposal and application
# per caller repository and owner, not separately per stage. Different
# caller repositories need external coordination if they target the
# same estate. A group keeps one pending entry and a newcomer cancels
# it; cancel-in-progress does not change that. Dry runs write nothing,
# so they lock within their own caller run instead, and this lock never
# makes them cancel one another or a live run. A caller's own group
# applies first, so callers must keep dry runs out of it as well.
# Invocations in one run share the dry group, so a caller must not fan
# out more than two same-owner dry runs per run.
concurrency:
  group: >-
    ${{ inputs.dry_run
    && format('triage-dry-run-{0}-{1}', github.run_id, inputs.org)
    || format('triage-pipeline-{0}-{1}', github.repository, inputs.org) }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 'Prepare'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      issues: read  # Collect snapshot and offline issue packet
      contents: read  # Checkout trusted assets
    outputs:
      assets_sha: "${{ steps.pinned.outputs.sha }}"
      namespace: "${{ steps.identity.outputs.namespace }}"
      evidence_id: "${{ steps.evidence.outputs.artifact-id }}"
      before_sha256: "${{ steps.digests.outputs.before }}"
      exclusions_sha256: "${{ steps.digests.outputs.exclusions }}"
      run_agent: "${{ steps.before.outputs.run_agent }}"
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'true'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Allocate invocation identity'
        id: identity
        env:
          RUN_ID: "${{ github.run_id }}"
          RUN_ATTEMPT: "${{ github.run_attempt }}"
        run: |
          python3 - <<'PY'
          import os, uuid
          run = os.environ['RUN_ID']
          attempt = os.environ['RUN_ATTEMPT']
          namespace = f"{run}-{attempt}-{uuid.uuid4().hex}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'namespace={namespace}\n')
          PY

      - name: 'Check inputs'
        env:
          MODEL: "${{ inputs.model }}"
        run: |
          [[ "$MODEL" =~ ^[a-z0-9.-]+$ ]] || {
            echo '::error::model must be a lower-case identifier'; exit 1; }

      - name: 'Require App for live runs'
        if: ${{ !inputs.dry_run && inputs.github_app_client_id == '' }}
        run: |
          echo '::error::Live runs require organisation App credentials'
          exit 1

      - name: 'Resolve assets ref'
        id: assets
        env:
          ASSETS_REF: "${{ inputs.assets_ref }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
        run: |
          ref="${ASSETS_REF:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ]; then
            echo '::error::Cannot resolve workflow commit; set assets_ref'
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 'Checkout trusted assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ steps.assets.outputs.ref }}"
          path: 'triage-assets'
          persist-credentials: false

      - name: 'Pin assets commit'
        id: pinned
        run: |
          sha="$(git -C triage-assets rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Pre-flight gate (docs/development/DESIGN.md section 12.8). The
      # contract tests and zizmor run again here, from the pinned
      # assets, so a drift merged into the workflow fails this run
      # before any token exists. The config check reads the credential
      # shapes from the environment and prints nothing it read.
      - name: 'Set up uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: 'Install zizmor'
        run: uv tool install 'zizmor==1.30.1'

      - name: 'Pre-flight: workflow contracts and audit'
        run: |
          cd triage-assets
          uv run --locked python -B scripts/preflight.py workflow --root .

      - name: 'Pre-flight: configuration and credentials'
        env:
          BOT_APP_CLIENT_ID: "${{ inputs.github_app_client_id }}"
          BOT_APP_PRIVATE_KEY: "${{ secrets.github_app_private_key }}"
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          EGRESS_POLICY: "${{ inputs.egress_policy }}"
          EGRESS_ALLOW_CONFIG: "${{ inputs.egress_allow_config }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
          ASSETS_SHA: "${{ steps.pinned.outputs.sha }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 triage-assets/scripts/preflight.py config \
            --config triage-assets/config/bot.json \
            --egress-policy "$EGRESS_POLICY" \
            --egress-allow-config "$EGRESS_ALLOW_CONFIG" \
            --workflow-sha "$JOB_WORKFLOW_SHA" \
            --assets-sha "$ASSETS_SHA" "${extra[@]}"

      - name: 'Mint read-only App token'
        id: app-token
        if: inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          repositories: "${{ inputs.repository }}"
          permission-issues: 'read'
          permission-metadata: 'read'

      # The slug the mint returns is the one signal that says whose key
      # was wired in; a probe with the token proves it cannot write.
      - name: 'Pre-flight: App identity and token grants'
        if: inputs.github_app_client_id != ''
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          MINTED_SLUG: "${{ steps.app-token.outputs.app-slug }}"
          REPOSITORY: "${{ github.repository }}"
        run: |
          python3 triage-assets/scripts/preflight.py identity \
            --config triage-assets/config/bot.json --minted-slug "$MINTED_SLUG"
          python3 triage-assets/scripts/preflight.py token \
            --repository "$REPOSITORY"

      - name: 'Snapshot issues before the session'
        id: before
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          ORG: "${{ inputs.org }}"
          REPOSITORY: "${{ inputs.repository }}"
          EXCLUDE_REPOS: "${{ inputs.exclude_repos }}"
          EXCLUDE_FILE: 'triage-assets/config/excluded-repos.txt'
          SKIP_AGENT: "${{ inputs.skip_agent }}"
          RETRIAGE: "${{ inputs.retriage }}"
        run: |
          bash triage-assets/scripts/snapshot.sh artefacts/before.json
          pending=$(jq 'map(select(.labels == [])) | length' \
            artefacts/before.json)
          run_agent=false
          if [ "$SKIP_AGENT" != true ] && \
            { [ "$pending" != 0 ] || [ "$RETRIAGE" = true ]; }; then
            run_agent=true
          fi
          echo "run_agent=$run_agent" >> "$GITHUB_OUTPUT"

      - name: 'Prepare offline issue packet'
        if: steps.before.outputs.run_agent == 'true'
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          RETRIAGE: "${{ inputs.retriage }}"
        run: |
          extra=()
          if [ "$RETRIAGE" = true ]; then extra+=(--retriage); fi
          python3 triage-assets/scripts/triage_evidence.py packet \
            --snapshot artefacts/before.json \
            --output artefacts/issue-packet.json "${extra[@]}"

      - name: 'Record evidence digests'
        id: digests
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              files = [('before', 'before.json'),
                       ('exclusions', 'excluded-repos.txt')]
              for name, path in files:
                  content = pathlib.Path('artefacts', path).read_bytes()
                  digest = hashlib.sha256(content).hexdigest()
                  output.write(f'{name}={digest}\n')
          PY

      # Artifact IDs and file digests come from this trusted job.
      # An artifact name alone is not an integrity boundary: a
      # runtime token can delete an artifact and recreate its name.
      - name: 'Publish prepared evidence'
        id: evidence
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "triage-evidence-${{ steps.identity.outputs.namespace }}"
          path: 'artefacts/'
          retention-days: 7
          if-no-files-found: 'error'

  propose:
    name: 'Propose'
    needs: 'prepare'
    if: needs.prepare.outputs.run_agent == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      contents: read  # Checkout the prepared prompt version
    outputs:
      # This identifies untrusted data, never code or provenance.
      session_id: "${{ steps.session.outputs.artifact-id }}"
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require pinned assets'
        env:
          ASSETS_SHA: "${{ needs.prepare.outputs.assets_sha }}"
        run: '[[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: 'Checkout prompt assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.prepare.outputs.assets_sha }}"
          path: 'triage-assets'
          persist-credentials: false

      - name: 'Fetch offline packet'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.prepare.outputs.evidence_id }}"
          merge-multiple: true
          path: 'artefacts'

      - name: 'Assemble prompt'
        env:
          ORG: "${{ inputs.org }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          RETRIAGE: "${{ inputs.retriage }}"
          REPOSITORY: "${{ inputs.repository }}"
        run: |
          {
            cat triage-assets/prompt/triage.md
            printf '\n## Runtime context\n\n'
            printf 'Target: %s/%s\n' "$ORG" "$REPOSITORY"
            printf 'Dry run: %s; retriage: %s\n' "$DRY_RUN" "$RETRIAGE"
            printf 'Read artefacts/issue-packet.json for the complete scan.\n'
          } > artefacts/prompt.md

      - name: 'Set up Node.js'
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Install Copilot CLI'
        env:
          PIN_DIR: 'triage-assets/tools/copilot-cli'
        run: |
          # npm ci from the committed lockfile rather than npm install
          # of a version: the lockfile pins the whole tree by integrity
          # hash, including detect-libc, which the CLI declares only as
          # a range. The pin comes from the verified assets checkout and
          # installs outside the workspace the session reads.
          dest="$RUNNER_TEMP/copilot-cli"
          mkdir -p "$dest"
          cp "$PIN_DIR/package.json" "$PIN_DIR/package-lock.json" \
            "$PIN_DIR/.npmrc" "$dest/"
          cd "$dest"
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$dest/node_modules/.bin" >> "$GITHUB_PATH"

      - name: 'Run triage agent'
        id: agent
        timeout-minutes: 20
        env:
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          COPILOT_HOME: "${{ runner.temp }}/copilot"
          MODEL: "${{ inputs.model }}"
        run: |
          # The prefix rejects native/classic tokens, not extra PAT
          # grants. The caller must provision Copilot Requests only.
          case "$COPILOT_GITHUB_TOKEN" in
            github_pat_*) ;;
            *)
              echo '::error::Use a model-only fine-grained Copilot PAT'
              exit 1 ;;
          esac
          mkdir -p artefacts/copilot-logs
          prompt="$(cat artefacts/prompt.md)"
          # Read-only utilities the session needs to page a large
          # packet. The CLI auto-approves what it classifies as a
          # read, so this list changes nothing today: run
          # 35324225186 shows sed and grep running unlisted while
          # an unlisted rm was refused. Declaring them states the
          # intended toolset and keeps the run working if that
          # classification tightens. Enforcement stays with the
          # deny list, the credential split and the applier.
          #
          # awk and sed are deliberately absent despite the session
          # reaching for sed. Neither is read-only: awk's system()
          # runs arbitrary commands, and GNU sed's w command writes
          # files. Blessing either would grant a standing bypass of
          # the write, gh and git denials below, because the shell
          # tool only ever sees the interpreter's own name. The CLI
          # may still auto-approve them as reads -- that gap is
          # DESIGN.md 12.2 -- but this workflow will not widen it.
          allow=''
          for cmd in cat jq grep head tail wc; do
            allow="$allow,shell($cmd),shell($cmd:*)"
          done
          copilot \
            --prompt="$prompt" \
            --model="$MODEL" \
            --available-tools=bash,list_bash,read_bash,stop_bash \
            --allow-tool="${allow#,}" \
            --deny-tool='write,shell(gh),shell(gh:*),shell(git),shell(git:*)' \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --no-ask-user --no-custom-instructions --disable-builtin-mcps \
            --no-auto-update --no-color \
            --log-dir=artefacts/copilot-logs \
            --share=artefacts/session-summary.md

      # The CLI spills large tool output to the system temp directory
      # and keeps session state in COPILOT_HOME. Neither leaves this
      # runner: the VM is single-use and the upload below names paths
      # under artefacts/ alone. Clearing them removes the session's
      # reason to attempt its own cleanup, which the tool policy
      # refuses -- a predictable refusal in the log is noise that a
      # real one has to compete with.
      #
      # This is hygiene, not secure erasure, and deliberately so.
      # srm is absent from the runner image, and coreutils shred
      # documents its own crucial assumption -- that the filesystem
      # and hardware overwrite in place -- which SSD wear-levelling
      # breaks. The same issue bodies also travel in the evidence
      # artefact by design, so scrubbing this copy would buy nothing.
      #
      # A later job cannot do this: the scratch lives on this runner.
      #
      # continue-on-error because hygiene must never gate a write.
      # This job's result gates the apply path, so a failure here
      # would leave Apply reporting while silently applying nothing
      # -- a far worse outcome than an uncleaned temporary file on a
      # VM about to be destroyed. The step's own outcome still
      # records the failure for anyone reading the run.
      - name: 'Clear session scratch files'
        if: always()
        continue-on-error: true
        env:
          COPILOT_HOME: "${{ runner.temp }}/copilot"
        run: |
          # Node resolves the temp directory through TMPDIR, so honour
          # it rather than assuming /tmp. Bounded to regular files the
          # CLI names itself: -maxdepth 1 and -type f stop a planted
          # symlink or directory redirecting the delete elsewhere.
          #
          # The find runs in its own command substitution rather than
          # heading a pipeline. Actions runs an undeclared shell as
          # 'bash -e {0}' with no pipefail, so a piped find that
          # failed would hand its status to wc and report a clean
          # cleanup -- leaving continue-on-error nothing to catch.
          scratch="${TMPDIR:-/tmp}"
          found=$(find "$scratch" -maxdepth 1 -type f \
            -name '*-copilot-tool-output-*' -print -delete)
          removed=0
          if [ -n "$found" ]; then
            removed=$(printf '%s\n' "$found" | wc -l | tr -d '[:space:]')
          fi
          rm -rf "$COPILOT_HOME"
          echo "Cleared $removed spilled tool-output file(s) and the" \
            "CLI home; artefacts/ is untouched."

      - name: 'Require proposal export'
        run: 'test -s artefacts/session-summary.md'

      - name: 'Preserve session output'
        id: session
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Namespace comes from Prepare; attempt distinguishes a
          # proposal-only rerun. Apply downloads the producer ID.
          # yamllint disable-line rule:line-length
          name: "triage-session-${{ needs.prepare.outputs.namespace }}-${{ github.run_attempt }}"
          path: |
            artefacts/session-summary.md
            artefacts/prompt.md
            artefacts/copilot-logs/
          retention-days: 7
          if-no-files-found: 'error'

  apply:
    name: 'Apply'
    needs: [prepare, propose]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      issues: read  # Fallback validation and after-snapshot reads
      contents: read  # Checkout trusted applier
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@a32eb064a1188f6b0f15d2c0c0381efe54b0dd22 # v0.12.2
        with:
          config: "${{ inputs.egress_allow_config }}"
          allow_list_summary: 'false'

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: "${{ env.CONNECTION_ALLOW_LIST }}"

      - name: 'Require trusted provenance'
        env:
          ASSETS_SHA: "${{ needs.prepare.outputs.assets_sha }}"
          EVIDENCE_ID: "${{ needs.prepare.outputs.evidence_id }}"
          BEFORE_SHA: "${{ needs.prepare.outputs.before_sha256 }}"
          EXCLUSIONS_SHA: "${{ needs.prepare.outputs.exclusions_sha256 }}"
        run: |
          [[ "$ASSETS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXCLUSIONS_SHA" =~ ^[0-9a-f]{64}$ ]]

      - name: 'Checkout trusted applier'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.prepare.outputs.assets_sha }}"
          path: 'triage-assets'
          persist-credentials: false

      - name: 'Fetch original evidence'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.prepare.outputs.evidence_id }}"
          merge-multiple: true
          path: 'evidence'

      - name: 'Verify evidence bytes'
        id: verified
        env:
          BEFORE_SHA: "${{ needs.prepare.outputs.before_sha256 }}"
          EXCLUSIONS_SHA: "${{ needs.prepare.outputs.exclusions_sha256 }}"
        run: |
          python3 triage-assets/scripts/triage_evidence.py verify \
            --directory evidence --before-sha256 "$BEFORE_SHA" \
            --exclusions-sha256 "$EXCLUSIONS_SHA"
          mkdir -p artefacts
          cp evidence/before.json artefacts/before.json
          cp evidence/excluded-repos.txt artefacts/excluded-repos.txt

      - name: 'Require session artifact identity'
        if: >-
          needs.prepare.outputs.run_agent == 'true' &&
          needs.propose.result == 'success'
        env:
          SESSION_ID: "${{ needs.propose.outputs.session_id }}"
        run: '[[ "$SESSION_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: 'Fetch untrusted session'
        if: >-
          needs.prepare.outputs.run_agent == 'true' &&
          needs.propose.result == 'success'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "${{ needs.propose.outputs.session_id }}"
          merge-multiple: true
          path: 'untrusted-session'

      # Ignore every other session filename, including any forged
      # snapshot or Python module. Never import from this directory.
      - name: 'Accept bounded proposal file'
        id: proposal
        if: >-
          needs.prepare.outputs.run_agent == 'true' &&
          needs.propose.result == 'success'
        run: |
          python3 triage-assets/scripts/triage_evidence.py proposal \
            --directory untrusted-session \
            --output artefacts/session-summary.md

      - name: 'Mint validation and apply token'
        id: app-token
        if: inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        # v3.2.0 forwards INPUT_PERMISSION-* but does not declare
        # these org grants. env avoids main/post input warnings.
        # When upgrading, move these back to with if declared;
        # action defaults could otherwise overwrite the env values.
        env:
          # yamllint disable-line rule:line-length
          INPUT_PERMISSION-ISSUE-FIELDS: "${{ steps.proposal.outcome == 'success' && 'read' || '' }}"
          # yamllint disable-line rule:line-length
          INPUT_PERMISSION-ISSUE-TYPES: "${{ steps.proposal.outcome == 'success' && 'read' || '' }}"
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          repositories: "${{ inputs.repository }}"
          # Even a reporting-only job must never mint write access.
          # yamllint disable-line rule:line-length
          permission-issues: "${{ !inputs.dry_run && needs.propose.result == 'success' && steps.proposal.outcome == 'success' && 'write' || 'read' }}"
          permission-metadata: 'read'

      # The token that may write: confirm it came from the configured
      # App before it is used.
      - name: 'Pre-flight: apply token identity'
        if: steps.app-token.outcome == 'success'
        env:
          MINTED_SLUG: "${{ steps.app-token.outputs.app-slug }}"
        run: |
          python3 triage-assets/scripts/preflight.py identity \
            --config triage-assets/config/bot.json --minted-slug "$MINTED_SLUG"

      - name: 'Apply triage proposal'
        id: apply
        if: >-
          needs.propose.result == 'success' &&
          steps.proposal.outcome == 'success'
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          TRIAGE_ORG: "${{ inputs.org }}"
          TRIAGE_REPOSITORY: "${{ inputs.repository }}"
          TRIAGE_EXCLUDE_FILE: 'evidence/excluded-repos.txt'
          TRIAGE_RETRIAGE: "${{ inputs.retriage }}"
          DRY_RUN: "${{ inputs.dry_run }}"
        run: |
          extra=()
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 triage-assets/scripts/apply_triage.py \
            --proposal artefacts/session-summary.md \
            --snapshot evidence/before.json \
            --output-json artefacts/apply-result.json "${extra[@]}"

      - name: 'Snapshot issues after application'
        id: after
        if: ${{ !cancelled() && steps.verified.outcome == 'success' }}
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          ORG: "${{ inputs.org }}"
          REPOSITORY: "${{ inputs.repository }}"
          EXCLUDE_FILE: 'evidence/excluded-repos.txt'
        run: |
          bash triage-assets/scripts/snapshot.sh artefacts/after.json

      - name: 'Build report'
        if: ${{ !cancelled() && steps.verified.outcome == 'success' }}
        env:
          DRY_RUN: "${{ inputs.dry_run }}"
          AFTER_OK: "${{ steps.after.outcome == 'success' }}"
          PROPOSE_RESULT: "${{ needs.propose.result }}"
          APPLY_RESULT: "${{ steps.apply.outcome }}"
        run: |
          extra=()
          if [ "$AFTER_OK" = true ]; then
            extra+=(--after artefacts/after.json)
          fi
          if [ "$DRY_RUN" = true ]; then extra+=(--dry-run); fi
          python3 triage-assets/scripts/triage_report.py \
            --before artefacts/before.json \
            --output-md artefacts/triage-report.md \
            --output-json artefacts/triage-report.json "${extra[@]}"
          printf '\nProposal job: %s; apply step: %s\n' \
            "$PROPOSE_RESULT" "$APPLY_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Attach run artefacts'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Apply-only reruns retain original producer IDs but get
          # a fresh report name, avoiding immutable-name conflicts.
          # yamllint disable-line rule:line-length
          name: "issues-triage-${{ needs.prepare.outputs.namespace }}-${{ github.run_attempt }}"
          path: 'artefacts/'
          retention-days: 90
          if-no-files-found: 'warn'
