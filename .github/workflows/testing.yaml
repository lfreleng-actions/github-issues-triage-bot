---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable issues-triage workflow.
#
# Pull request runs are SECRETLESS by design: a same-repository PR
# can modify the local reusable workflow and asset scripts, so a PR
# check that held a model credential would hand it to the code
# under review. PR runs therefore set skip_agent, proving the
# plumbing (snapshots, exclusion filtering, report generation,
# artefact upload) from the PR head without any secret in reach.
#
# The full agent session -- dry-run, read-only -- runs from
# workflow_dispatch instead: a maintainer triggers it explicitly
# against a chosen ref, which is the trusted, approval-gated
# execution path for validating agent behaviour before merge.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:
    inputs:
      engine:
        description: 'Agent engine for the manual dry-run'
        type: choice
        options:
          - claude
          - gemini
          - copilot
        default: 'claude'

permissions: {}

# A new push to a pull request supersedes that pull request's older
# run. Each manual dispatch takes a group of its own, so a second
# dispatch never cancels an agent session already in flight.
concurrency:
  group: >-
    ${{ format('testing-{0}', github.event_name == 'pull_request'
    && github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  plumbing:
    name: 'Plumbing (secretless, ${{ matrix.invocation }})'
    strategy:
      matrix:
        # Two legs prove invocation namespaces never collide. Both are
        # dry, so they share only this run's lock: one runs, one waits.
        # A third leg would take the single pending slot and cancel one.
        invocation: [first, second]
    if: github.event_name == 'pull_request'
    permissions:
      # The job passes no secrets and skips the agent session, so
      # even a malicious PR-head script holds nothing but reads.
      issues: read  # Snapshot reads
      contents: read  # Asset checkout and metadata reads
    uses: $/.github/workflows/issues-triage.yaml
    with:
      # The owner running the test, so a fork exercises its own
      # organisation rather than reaching into the upstream one.
      # Evaluates to lfreleng-actions upstream.
      org: "${{ github.repository_owner }}"
      dry_run: true
      # Skip the agent: PR runs are secretless (see header comment).
      skip_agent: true
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4
      assets_repository: >-
        ${{ github.event.pull_request.head.repo.full_name }}
      assets_ref: "${{ github.event.pull_request.head.sha }}"

  triage-dry-run:
    name: 'Triage dry-run (manual)'
    if: github.event_name == 'workflow_dispatch'
    permissions:
      issues: read  # Snapshot and dry-run reads
      contents: read  # Asset checkout and metadata reads
    uses: $/.github/workflows/issues-triage.yaml
    with:
      # See the plumbing job: the caller's own owner, so fork runs
      # stay inside the fork.
      org: "${{ github.repository_owner }}"
      # Read-only: report proposed labels, apply nothing.
      dry_run: true
      # Re-examine labelled issues so the agent session always runs
      # and the report always carries proposals to inspect.
      retriage: true
      # Operator's choice of engine; empty guards against direct
      # API dispatches that omit the input.
      engine: "${{ inputs.engine || 'claude' }}"
      # Bound the session cost on test runs.
      max_turns: '40'
      egress_policy: 'block'
      # yamllint disable-line rule:line-length
      egress_allow_config: '@e0e35011ee145321a51d3226f044ec88dfe645b1'  # v0.16.4
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      # Personal fine-grained PAT with Copilot Requests and no
      # repository grants. Native caller tokens are not supported.
      copilot_token: ${{ secrets.COPILOT_CLI_TOKEN }}

  regression:
    name: 'Offline regression tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Test checked-out code without write credentials
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: 'audit'
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: 'Run offline regression suite'
        run: uv run --locked python -B -m unittest discover -s tests -v

  docs:
    name: 'Documentation build'
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false

      # Proves the site builds from the pull request head without
      # granting it any Pages permission; the deployment lives in
      # documentation.yaml and runs from the default branch alone.
      - name: 'Build documentation'
        shell: bash
        run: |
          uv venv --python 3.13
          uv pip install --require-hashes \
            --requirement docs/requirements.txt
          .venv/bin/mkdocs build --strict
