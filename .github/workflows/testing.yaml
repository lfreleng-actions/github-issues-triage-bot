---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable issues-triage workflow.
#
# Pull request runs are SECRETLESS by design: a same-repository PR
# can modify the local reusable workflow and asset scripts, so a PR
# check that held a model credential would hand it to the code
# under review. PR runs therefore set skip_agent, proving the
# plumbing (snapshots, exclusion filtering, report generation,
# artefact upload) from the PR head without any secret in reach.
#
# The full agent session -- dry-run, read-only -- runs from
# workflow_dispatch instead: a maintainer triggers it explicitly
# against a chosen ref, which is the trusted, approval-gated
# execution path for validating agent behaviour before merge.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:

permissions: {}

# A new push to a pull request supersedes that pull request's older
# run. Each manual dispatch takes a group of its own, so a second
# dispatch never cancels an agent session already in flight.
concurrency:
  group: >-
    ${{ format('testing-{0}', github.event_name == 'pull_request'
    && github.ref || github.run_id) }}
  cancel-in-progress: true

jobs:
  plumbing:
    name: 'Plumbing (secretless, ${{ matrix.invocation }})'
    strategy:
      matrix:
        # Two legs prove invocation namespaces never collide. Both are
        # dry, so they share only this run's lock: one runs, one waits.
        # A third leg would take the single pending slot and cancel one.
        invocation: [first, second]
    if: github.event_name == 'pull_request'
    permissions:
      # The job passes no secrets and skips the agent session, so
      # even a malicious PR-head script holds nothing but reads.
      issues: read  # Snapshot reads
      contents: read  # Asset checkout and metadata reads
    uses: $/.github/workflows/issues-triage.yaml
    with:
      # The owner running the test, so a fork exercises its own
      # organisation rather than reaching into the upstream one.
      # Evaluates to lfreleng-actions upstream.
      org: "${{ github.repository_owner }}"
      dry_run: true
      # Skip the agent: PR runs are secretless (see header comment).
      skip_agent: true
      harden_runner_egress: 'block'
      # yamllint disable-line rule:line-length
      harden_runner_allowlist: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      assets_repository: >-
        ${{ github.event.pull_request.head.repo.full_name }}
      assets_ref: "${{ github.event.pull_request.head.sha }}"

  triage-dry-run:
    name: 'Triage dry-run (manual)'
    if: github.event_name == 'workflow_dispatch'
    permissions:
      issues: read  # Snapshot and dry-run reads
      contents: read  # Asset checkout and metadata reads
    uses: $/.github/workflows/issues-triage.yaml
    with:
      # See the plumbing job: the caller's own owner, so fork runs
      # stay inside the fork.
      org: "${{ github.repository_owner }}"
      # Read-only: report proposed labels, apply nothing.
      dry_run: true
      # Re-examine labelled issues so the agent session always runs
      # and the report always carries proposals to inspect.
      retriage: true
      harden_runner_egress: 'block'
      # yamllint disable-line rule:line-length
      harden_runner_allowlist: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0
      assets_repository: "${{ github.repository }}"
      assets_ref: "${{ github.sha }}"
    secrets:
      # Personal fine-grained PAT with Copilot Requests and no
      # repository grants. Native caller tokens are not supported.
      copilot_token: ${{ secrets.COPILOT_CLI_TOKEN }}

  regression:
    name: 'Offline regression tests'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Test checked-out code without write credentials
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'
      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install uv'
        id: setup-uv
        # setup-uv reads uv settings from its working directory and
        # puts uv tools on PATH, so both live under RUNNER_TEMP, outside
        # the workspace. Its only uv call here is 'uv python find',
        # whose result it executes, and the job's environment (PATH,
        # UV_PYTHON and the like, which any earlier step can set) would
        # choose it: an invalid UV_PYTHON_PREFERENCE makes uv refuse its
        # arguments before any lookup. An inherited UV_PYTHON_ARCH would
        # make setup-uv probe uv, which that refusal fails, so it is
        # emptied. The cache stays off: the post-step 'uv cache prune'
        # would hit the same refusal. setup-uv puts UV_PYTHON_INSTALL_DIR
        # on PATH ahead of its own uv and then runs a bare 'uv', so an
        # inherited value could start a planted uv: the step names the
        # directory 'Install Python' installs into instead.
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          UV_PYTHON_ARCH: ''
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"
      # The same trusted interpreter issues-triage.yaml installs.
      - name: 'Install Python'
        id: python
        shell: bash
        # uv python find starts a .venv interpreter in its working
        # directory to inspect it, even under env -i, so this runs in
        # RUNNER_TEMP, outside the workspace.
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          # A system search also skips .venv interpreters above the
          # working directory; with --managed-python and no PATH, it
          # returns only uv's install.
          py=$(env -i "${clean[@]}" "$UV" python find --managed-python \
            --system 3.13)
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"
      - name: 'Run offline regression suite'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
        run: |
          "$UV" run --locked --python "$PYTHON" \
            python -B -m unittest discover -s tests -v

  # Runs the prepare job's uv steps against a workspace holding a
  # .venv, a .python-version and a uv.toml, in its root and in the
  # assets checkout, and against a job environment that an earlier
  # step pointed at a planted interpreter through GITHUB_PATH and
  # GITHUB_ENV, one leg per set of variables. The four uv steps copy
  # the prepare job's exactly; tests/test_workflow.py keeps them
  # identical.
  preflight-isolation:
    name: 'Pre-flight interpreter isolation (${{ matrix.route }})'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read  # Check out the assets the pre-flight runs
    strategy:
      fail-fast: false
      matrix:
        # uv-python: UV_PYTHON and UV_PYTHON_SEARCH_PATH name the bait.
        # virtual-env: VIRTUAL_ENV, CONDA_PREFIX and
        # UV_INTERNAL__PARENT_INTERPRETER name it, UV_PYTHON unset.
        route: [uv-python, virtual-env]
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Checkout assets'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 'triage-assets'
          persist-credentials: false

      # Each planted interpreter, and each planted uv, records its path
      # and exits non-zero; the uv.toml names a uv release that does
      # not exist. The workspace .venv/bin then leads PATH, both legs
      # point UV_PYTHON_INSTALL_DIR, which setup-uv puts on PATH, at a
      # workspace directory holding a bait uv, and this leg's variables
      # name the bait for every later step.
      - name: 'Plant interpreters and uv settings'
        env:
          ROUTE: "${{ matrix.route }}"
        run: |
          marker="$RUNNER_TEMP/planted-ran"
          plant() {
            mkdir -p "$1/.venv/bin" "$1/.venv/conda-meta" "$1/planted-bin" \
              "$1/planted-install"
            printf 'home = /usr/bin\nversion = 3.12.0\n' > "$1/.venv/pyvenv.cfg"
            for exe in .venv/bin/python3 .venv/bin/python \
                .venv/bin/python3.13 .venv/bin/uv planted-bin/python3 \
                planted-install/uv
            do
              printf '#!/bin/sh\necho "%s" >> "%s"\nexit 1\n' \
                "$1/$exe" "$marker" > "$1/$exe"
              chmod +x "$1/$exe"
            done
            echo "$1/planted-bin/python3" > "$1/.python-version"
          }
          plant "$GITHUB_WORKSPACE"
          plant "$GITHUB_WORKSPACE/triage-assets"
          printf '%s\n' 'cache-dir = "/nonexistent/planted-cache"' \
            'required-version = "==0.0.1"' > "$GITHUB_WORKSPACE/uv.toml"
          bait="$GITHUB_WORKSPACE/.venv"
          echo "$bait/bin" >> "$GITHUB_PATH"
          {
            echo 'UV_PYTHON_ARCH=x86_64'
            echo 'UV_NO_CACHE=1'
            echo "UV_PYTHON_INSTALL_DIR=$GITHUB_WORKSPACE/planted-install"
            case "$ROUTE" in
              uv-python)
                echo "UV_PYTHON=$bait/bin/python3"
                echo "UV_PYTHON_SEARCH_PATH=$bait/bin" ;;
              virtual-env)
                echo "VIRTUAL_ENV=$bait"
                echo "CONDA_PREFIX=$bait"
                echo "UV_INTERNAL__PARENT_INTERPRETER=$bait/bin/python3" ;;
              *)
                echo "::error::Unknown route: $ROUTE"
                exit 1 ;;
            esac
          } >> "$GITHUB_ENV"

      # Shows the planted PATH is live before the uv steps: a lookup
      # from a Python run by absolute path (command -v would return the
      # bait) starts the planted python3 and uv. Then, with the
      # inherited UV_PYTHON_INSTALL_DIR put first on PATH as setup-uv
      # does, a bare uv starts that directory's bait.
      - name: 'Control: PATH reaches the bait'
        run: |
          marker="$RUNNER_TEMP/planted-ran"
          for exe in python3 uv; do
            /usr/bin/python3 -I -c \
              'import subprocess, sys; subprocess.run(sys.argv[1:])' "$exe" \
              || true
            if ! grep -qxF "$GITHUB_WORKSPACE/.venv/bin/$exe" "$marker"; then
              echo "::error::The planted $exe did not run from PATH"
              exit 1
            fi
          done
          PATH="$UV_PYTHON_INSTALL_DIR:$PATH" /usr/bin/python3 -I -c \
            'import subprocess; subprocess.run(["uv"])' || true
          if ! grep -qxF "$GITHUB_WORKSPACE/planted-install/uv" "$marker"
          then
            echo '::error::The bait in UV_PYTHON_INSTALL_DIR did not run'
            exit 1
          fi
          rm "$marker"

      - name: 'Set up uv'
        id: setup-uv
        # setup-uv reads uv settings from its working directory and
        # puts uv tools on PATH, so both live under RUNNER_TEMP, outside
        # the workspace. Its only uv call here is 'uv python find',
        # whose result it executes, and the job's environment (PATH,
        # UV_PYTHON and the like, which any earlier step can set) would
        # choose it: an invalid UV_PYTHON_PREFERENCE makes uv refuse its
        # arguments before any lookup. An inherited UV_PYTHON_ARCH would
        # make setup-uv probe uv, which that refusal fails, so it is
        # emptied. The cache stays off: the post-step 'uv cache prune'
        # would hit the same refusal. setup-uv puts UV_PYTHON_INSTALL_DIR
        # on PATH ahead of its own uv and then runs a bare 'uv', so an
        # inherited value could start a planted uv: the step names the
        # directory 'Install Python' installs into instead.
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          UV_PYTHON_ARCH: ''
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"

      # A uv-managed Python, installed and found under an emptied
      # environment so no variable the job holds can choose it. Every
      # later uv call takes it by absolute path.
      - name: 'Install Python'
        id: python
        shell: bash
        # uv python find starts a .venv interpreter in its working
        # directory to inspect it, even under env -i, so this runs in
        # RUNNER_TEMP, outside the workspace.
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          # A system search also skips .venv interpreters above the
          # working directory; with --managed-python and no PATH, it
          # returns only uv's install.
          py=$(env -i "${clean[@]}" "$UV" python find --managed-python \
            --system 3.13)
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"

      - name: 'Install zizmor'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
        run: |
          "$UV" tool install --python "$PYTHON" 'zizmor==1.30.1'

      - name: 'Pre-flight: workflow contracts and audit'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
        run: |
          # uv run reuses an existing project environment, and runs its
          # interpreter, in the assets checkout or a uv workspace above
          # it. Build the environment under RUNNER_TEMP instead, from
          # the interpreter the step above installed.
          cd triage-assets
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/preflight-venv" \
            "$UV" run --locked --python "$PYTHON" \
            python -B scripts/preflight.py workflow --root .

      # Fails if any bait ran during the uv steps, then shows this leg's
      # variables do steer an unguarded uv call to the bait.
      - name: 'Check no planted interpreter ran'
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
        run: |
          marker="$RUNNER_TEMP/planted-ran"
          if [ -e "$marker" ]; then
            echo '::error::A planted interpreter ran:'
            cat "$marker"
            exit 1
          fi
          "$UV" --version
          "$RUNNER_TEMP/preflight-venv/bin/python" --version
          (cd "$RUNNER_TEMP" &&
            "$UV" run --no-config --no-project python -c '') || true
          if [ ! -e "$marker" ]; then
            echo "::error::uv ignored this leg's planted variables"
            exit 1
          fi

  docs:
    name: 'Documentation build'
    if: github.event_name == 'pull_request'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        id: setup-uv
        # setup-uv reads uv settings from its working directory and
        # puts uv tools on PATH, so both live under RUNNER_TEMP, outside
        # the workspace. Its only uv call here is 'uv python find',
        # whose result it executes, and the job's environment (PATH,
        # UV_PYTHON and the like, which any earlier step can set) would
        # choose it: an invalid UV_PYTHON_PREFERENCE makes uv refuse its
        # arguments before any lookup. An inherited UV_PYTHON_ARCH would
        # make setup-uv probe uv, which that refusal fails, so it is
        # emptied. The cache stays off: the post-step 'uv cache prune'
        # would hit the same refusal. setup-uv puts UV_PYTHON_INSTALL_DIR
        # on PATH ahead of its own uv and then runs a bare 'uv', so an
        # inherited value could start a planted uv: the step names the
        # directory 'Install Python' installs into instead.
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          working-directory: "${{ runner.temp }}"
          tool-bin-dir: "${{ runner.temp }}/uv-tool-bin"
          enable-cache: false
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          UV_PYTHON_ARCH: ''
          UV_PYTHON_INSTALL_DIR: "${{ runner.temp }}/uv-python"

      # The same trusted interpreter issues-triage.yaml installs.
      - name: 'Install Python'
        id: python
        shell: bash
        # uv python find starts a .venv interpreter in its working
        # directory to inspect it, even under env -i, so this runs in
        # RUNNER_TEMP, outside the workspace.
        working-directory: "${{ runner.temp }}"
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          INSTALL_DIR: "${{ runner.temp }}/uv-python"
        run: |
          clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
            "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR"
            "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache")
          for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
              https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
              UV_NATIVE_TLS; do
            if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
          done
          env -i "${clean[@]}" "$UV" python install --quiet --no-bin 3.13
          # A system search also skips .venv interpreters above the
          # working directory; with --managed-python and no PATH, it
          # returns only uv's install.
          py=$(env -i "${clean[@]}" "$UV" python find --managed-python \
            --system 3.13)
          case "$py" in
            "$INSTALL_DIR"/*) ;;
            *) echo "::error::uv found Python outside its install directory"
               exit 1 ;;
          esac
          echo "path=$py" >> "$GITHUB_OUTPUT"

      # Proves the site builds from the pull request head without
      # granting it any Pages permission; the deployment lives in
      # documentation.yaml and runs from the default branch alone.
      - name: 'Build documentation'
        shell: bash
        env:
          UV: "${{ steps.setup-uv.outputs.uv-path }}"
          PYTHON: "${{ steps.python.outputs.path }}"
        run: |
          "$UV" venv --python "$PYTHON" .venv
          "$UV" pip install --python "$PWD/.venv/bin/python" \
            --require-hashes --requirement docs/requirements.txt
          .venv/bin/mkdocs build --strict
