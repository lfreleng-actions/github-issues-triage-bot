---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Scheduled thin caller for the reusable issues-triage workflow in
# this repository: 07:00 UTC every weekday, scanning the whole
# organisation this repository belongs to.
#
# Scheduled runs apply triage changes. Manual dispatch defaults to
# dry-run and respects the operator's choice. Disable this workflow
# to pause the schedule if an operational problem needs attention
# (docs/development/DESIGN.md section 11). Egress stays in audit mode.
#
# Scheduled runs take the copilot engine: the organisation already
# pays for Copilot, so triage spend draws on an existing
# entitlement rather than a third vendor relationship. A manual
# dispatch picks any of the three; per-engine credentials and
# their setup live in docs/setup/.
#
# Trusted jobs prepare the offline packet and apply the proposal.
# The agent job has no App action or installation-token input
# (DESIGN.md section 13.7).
name: 'Issues Triage ⏰'

# yamllint disable-line rule:truthy
on:
  schedule:
    # 07:00 UTC, Monday to Friday
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Agent engine'
        type: choice
        options:
          - copilot
          - claude
          - gemini
        default: 'copilot'
      dry_run:
        description: 'Test run only, make no changes'
        type: boolean
        default: true
      retriage:
        description: 'Process all open issues, including labelled ones'
        type: boolean
        default: false
      repository:
        description: 'Restrict the scan to one repository'
        type: string
        default: ''

permissions: {}

# Serialise live runs of this caller. A group keeps one pending run and
# a newcomer cancels it, so this is not a FIFO queue. A dry dispatch
# writes nothing and takes a group of its own: it neither waits behind
# the schedule nor cancels a pending live run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run
    && format('issues-triage-dry-run-{0}', github.run_id)
    || 'issues-triage' }}
  cancel-in-progress: false

jobs:
  triage:
    name: 'Triage'
    permissions:
      # Live labelling uses the App token, never this grant
      issues: read  # Snapshot reads when running without the App
      contents: read  # Asset checkout and repository metadata reads
    uses: $/.github/workflows/issues-triage.yaml
    with:
      # The owner this workflow runs under, which upstream is
      # lfreleng-actions. Naming it this way rather than hard-coding
      # it keeps a fork's scheduled runs inside the fork.
      org: "${{ github.repository_owner }}"
      # Scheduled runs hold the Copilot engine; a manual dispatch
      # takes the operator's choice. The fallback covers schedule
      # events, which carry no inputs, and API dispatches that
      # omit this one.
      engine: ${{ inputs.engine || 'copilot' }}
      # The schedule is live; manual dispatch retains its dry-run
      # default and can opt into writes by clearing that input.
      dry_run: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      retriage: ${{ inputs.retriage || false }}
      repository: ${{ inputs.repository || '' }}
      egress_policy: 'audit'
      # Repository-level credentials reach trusted preparation
      # and application actions, never an action in the agent job.
      # No client id permits dry-run fallback; a missing key fails
      # token creation before the agent runs.
      github_app_client_id: ${{ vars.BOT_APP_CLIENT_ID || '' }}
      # Run the pipeline with the assets from the triggering commit.
      assets_repository: ${{ github.repository }}
      assets_ref: ${{ github.sha }}
    secrets:
      # Each engine reads one of these; the reusable workflow fails
      # fast when the selected engine's credential is absent.
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      copilot_token: ${{ secrets.COPILOT_CLI_TOKEN }}
      github_app_private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
