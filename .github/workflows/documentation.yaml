---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages
# using the Actions deployment model (configure-pages +
# upload-pages-artifact + deploy-pages).
#
# IMPORTANT: in the repository settings under "Pages > Build and
# deployment", the "Source" must read "GitHub Actions" before the
# first deployment succeeds.
name: 'Documentation 📚'

# Runs when the published content changes on the default branch, and
# on manual dispatch for a republish. Pull requests build the site in
# the testing workflow instead, which proves the build without
# granting a pull request head any Pages permission.
#
# A dispatch can select any ref, so the deploy job below refuses to
# publish anything but the default branch; dispatching another ref
# builds the site and stops there.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/documentation.yaml'
  workflow_dispatch:

permissions: {}

# Serialise every deployment: they all publish to the same site, and
# an out-of-order completion would republish stale content. Queue
# rather than cancel, per the actions/deploy-pages guidance.
concurrency:
  group: 'github-pages'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build site'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # No caching on a publishing path: a restored cache that a
          # lower-privileged run could populate buys little here and
          # widens the supply chain for the deployed artefact.
          enable-cache: false

      - name: 'Build documentation'
        shell: bash
        # This repository is not a Python package, so the build runs
        # in a throwaway environment holding the documentation
        # requirements and nothing else. --require-hashes refuses
        # anything outside the compiled lock, so the deployed site
        # comes from one reviewed dependency tree; --strict promotes
        # MkDocs warnings (broken links, orphaned pages) to failures.
        run: |
          uv venv --python 3.13
          uv pip install --require-hashes \
            --requirement docs/requirements.txt
          .venv/bin/mkdocs build --strict

      - name: 'Upload Pages artifact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: 'site'

  deploy:
    name: 'Deploy to GitHub Pages'
    needs: build
    # workflow_dispatch accepts any ref. Publishing one would put
    # unreviewed content on the site, so deployment stays pinned to
    # the default branch and a dispatch elsewhere builds only.
    if: github.ref == 'refs/heads/main'
    runs-on: 'ubuntu-latest'
    permissions:
      pages: write  # Publish the built site to GitHub Pages
      id-token: write  # OIDC token for the Pages deployment
    environment:
      name: 'github-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'Configure Pages'
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: 'Deploy to GitHub Pages'
        id: deployment
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      - name: 'Publish site URL to summary'
        if: always()
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## 📚 Documentation published"
            echo ""
            if [ -n "${PAGE_URL}" ]; then
              echo "[${PAGE_URL}](${PAGE_URL})"
            else
              echo "_(deployment did not produce a URL)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
